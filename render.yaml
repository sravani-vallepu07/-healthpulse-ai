services:
  - type: web
    name: healthpulse-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python seed.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./healthcare_platform.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: structured_agent
      - key: VOICE_PROVIDER
        value: browser
